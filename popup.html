<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <style>
    body { font: 14px system-ui, "Segoe UI", sans-serif; width: 280px; margin: 0; padding: 14px; color: #222; }
    h1 { font-size: 15px; margin: 0 0 12px; }
    label { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 8px 0; border-top: 1px solid #eee; cursor: pointer; }
    label.disabled { opacity: .45; cursor: default; }
    small { display: block; color: #777; font-size: 11px; margin-top: 2px; }
    #host { font-family: monospace; }
    input { width: 18px; height: 18px; flex: none; }
  </style>
</head>
<body>
  <h1>Bidi Fixer</h1>
  <label><span>Enabled</span><input type="checkbox" id="enabled"></label>
  <label id="siteRow"><span>Enabled on <span id="host">this site</span></span><input type="checkbox" id="site"></label>
  <label>
    <span>Isolate mixed phrases
      <small>More accurate, but modifies the page DOM (experimental)</small></span>
    <input type="checkbox" id="isolateRuns">
  </label>
  <script src="popup.js"></script>
</body>
</html>
